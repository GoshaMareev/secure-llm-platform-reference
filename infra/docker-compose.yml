name: secure-llm-platform-reference

services:
  oauth2-proxy:
    image: ${OAUTH2_PROXY_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.15.2@sha256:aa0bd8dd5ab0c78e4c91c92755ad573a5f92241f88138b4141b8ec803463b4fd}
    environment:
      OAUTH2_PROXY_PROVIDER: entra-id
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID:-common}/v2.0
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL:-http://127.0.0.1:4180/oauth2/callback}
      OAUTH2_PROXY_UPSTREAMS: http://rag-assistant:8000
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}
      # Deny by default until a real Entra security-group ID is supplied.
      OAUTH2_PROXY_ALLOWED_GROUPS: ${ENTRA_ALLOWED_GROUP_ID:-00000000-0000-0000-0000-000000000000}
      OAUTH2_PROXY_SCOPE: openid profile email
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-false}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_STANDARD_LOGGING: "true"
      OAUTH2_PROXY_AUTH_LOGGING: "true"
      OAUTH2_PROXY_REQUEST_LOGGING: "true"
    ports:
      - "127.0.0.1:4180:4180"
    depends_on:
      rag-assistant:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks: [platform]

  rag-assistant:
    build:
      context: ..
      dockerfile: apps/rag-assistant/Dockerfile
    environment:
      RAG_INDEX_PATH: /app/generated/index.json
      RAG_GATEWAY_MODE: ${RAG_GATEWAY_MODE:-demo}
      RAG_MIN_CONFIDENCE: ${RAG_MIN_CONFIDENCE:-0.34}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RUNTIME_LOG_PATH: /var/log/reference/runtime/runtime.jsonl
      AUDIT_LOG_PATH: /var/log/reference/audit/audit.jsonl
      AUDIT_INCLUDE_PROMPT: ${AUDIT_INCLUDE_PROMPT:-false}
      AUDIT_PSEUDONYM_SALT: ${AUDIT_PSEUDONYM_SALT:-}
      REQUIRE_AUTH_HEADER: "true"
      GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-true}
      PII_BACKEND: ${PII_BACKEND:-presidio}
      PRESIDIO_ANALYZER_URL: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_URL: http://presidio-anonymizer:3000
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://host.docker.internal:4000/v1}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-local-model}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
    volumes:
      - runtime-logs:/var/log/reference/runtime
      - audit-spool:/var/log/reference/audit
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    networks: [platform]

  # Shared PII services. The RAG API and the LiteLLM gateway call the same pair,
  # so detection rules and the spaCy model live in one place.
  presidio-analyzer:
    image: ${PRESIDIO_ANALYZER_IMAGE:-ghcr.io/data-privacy-stack/presidio-analyzer:latest}
    ports:
      - "127.0.0.1:5002:3000"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks: [platform, gateway]

  presidio-anonymizer:
    image: ${PRESIDIO_ANONYMIZER_IMAGE:-ghcr.io/data-privacy-stack/presidio-anonymizer:latest}
    ports:
      - "127.0.0.1:5001:3000"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [platform, gateway]

  # Model gateway with Presidio guardrails on every request and response.
  # Started only with --profile gateway; needs LITELLM_MASTER_KEY.
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    profiles: [gateway]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_UPSTREAM_BASE_URL: ${LITELLM_UPSTREAM_BASE_URL:-http://host.docker.internal:11434/v1}
      LITELLM_UPSTREAM_MODEL: ${LITELLM_UPSTREAM_MODEL:-openai/llama3.1}
      LITELLM_UPSTREAM_API_KEY: ${LITELLM_UPSTREAM_API_KEY:-not-needed-for-local}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
    volumes:
      - ../gateway/litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # The process accepts connections before application startup completes;
    # readiness is what `up --wait` must wait for.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks: [platform, gateway]

  fluent-bit:
    image: ${FLUENT_BIT_IMAGE:-fluent/fluent-bit:3.1.9@sha256:4af3920cc2ff976200e0fc09f23e7ca4ee7d4477a6d592cb496fc39378181b02}
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    depends_on:
      loki:
        condition: service_started
      rag-assistant:
        condition: service_healthy
    volumes:
      - runtime-logs:/logs:ro
      - fluent-state:/state
      - ../observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../observability/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks: [platform]

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.1.1@sha256:e689cc634841c937de4d7ea6157f17e29cf257d6a320f1c293ab18d46cfea986}
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
      - ../observability/loki-config.yaml:/etc/loki/config.yaml:ro
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks: [platform]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks: [platform]

networks:
  platform:
    internal: true
  # Egress for the model gateway and loopback publishing of the Presidio and
  # LiteLLM ports for local checks. The RAG API stays on the internal network.
  gateway: {}

volumes:
  runtime-logs:
  audit-spool:
  fluent-state:
  loki-data:
  prometheus-data:
