# Local HTTP demo only. A hosted deployment requires HTTPS and secure cookies.
provider = "google"
scope = "openid email profile"
client_secret_file = "/run/secrets/google-client-secret"
cookie_secret_file = "/run/secrets/google-cookie-secret"
authenticated_emails_file = "/run/secrets/google-allowed-emails"
redirect_url = "http://localhost:4180/oauth2/callback"
upstreams = ["http://rag-assistant:8000"]
http_address = "0.0.0.0:4180"
code_challenge_method = "S256"
cookie_name = "_secure_llm_google"
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "1h"
cookie_refresh = "15m"
pass_user_headers = true
prefer_email_to_user = false
pass_basic_auth = false
pass_access_token = false
pass_authorization_header = false
skip_auth_strip_headers = true
reverse_proxy = false
skip_provider_button = true
# Avoid logging OAuth callback codes, session details and account email addresses.
auth_logging = false
request_logging = false
standard_logging = true
