[project]
name = "secure-llm-platform-reference"
version = "0.1.0"
description = "Public-safe reference for retrieval, LLM gateway, evaluation, observability, and prompt audit controls."
requires-python = ">=3.12"
license = { text = "All Rights Reserved" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

