[SERVICE]
    Flush         1
    Grace         10
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               reference.runtime
    Path              /logs/runtime.jsonl
    Parser            reference_json
    DB                /state/runtime-tail.db
    Read_from_Head    true
    Refresh_Interval  1

[OUTPUT]
    Name          loki
    Match         reference.runtime
    Host          loki
    Port          3100
    Labels        job=secure-llm-reference,stream=operational
    Line_Format   json

