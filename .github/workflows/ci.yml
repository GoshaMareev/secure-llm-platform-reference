name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Build synthetic index and run evaluations
        run: |
          python -m ingestion.build_index --source sample-data --output .local/index.json
          PYTHONPATH=".:apps/rag-assistant" python evals/run.py --index .local/index.json --cases evals/cases.jsonl --compare --quiet

      - name: Check publication safety
        run: python scripts/pre_publication_check.py

      - name: Validate Compose model
        run: docker compose -f infra/docker-compose.yml config --quiet

  presidio:
    # Same tests and evaluation against the real Presidio containers that the
    # Compose stack runs for the RAG API and the LiteLLM gateway.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      presidio-analyzer:
        image: ghcr.io/data-privacy-stack/presidio-analyzer:latest
        ports: ["5002:3000"]
      presidio-anonymizer:
        image: ghcr.io/data-privacy-stack/presidio-anonymizer:latest
        ports: ["5001:3000"]
    env:
      PRESIDIO_ANALYZER_URL: http://127.0.0.1:5002
      PRESIDIO_ANONYMIZER_URL: http://127.0.0.1:5001
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Wait for Presidio
        run: |
          for service in "$PRESIDIO_ANALYZER_URL" "$PRESIDIO_ANONYMIZER_URL"; do
            for attempt in $(seq 1 60); do
              curl -fsS "$service/health" && break
              sleep 3
            done
          done

      - name: Run tests including live Presidio checks
        env:
          PRESIDIO_INTEGRATION: "1"
        run: python -m unittest discover -s tests -v

      - name: Smoke-test Presidio redaction
        run: python scripts/smoke_presidio.py

      - name: Run evaluations with Presidio
        run: |
          python -m ingestion.build_index --source sample-data --output .local/index.json
          PYTHONPATH=".:apps/rag-assistant" python evals/run.py --index .local/index.json \
            --cases evals/cases.jsonl --pii-backend presidio --compare --report evals/report-presidio.md

      - name: Upload Presidio evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-report-presidio
          path: evals/report-presidio.md
