# All provider credentials stay in this service. Clients use stable aliases.
model_list:
  - model_name: reference-chat
    litellm_params:
      model: openrouter/google/gemini-2.5-flash
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 1024
    model_info:
      mode: chat
  - model_name: reference-vision
    litellm_params:
      model: openrouter/openai/gpt-4.1-mini
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 1024
    model_info:
      mode: chat
      supports_vision: true
  - model_name: reference-multimodal
    litellm_params:
      model: openrouter/google/gemini-3-flash-preview
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 1024
    model_info:
      mode: chat
      supports_vision: true
  - model_name: reference-embedding
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: embedding
  - model_name: reference-rerank
    litellm_params:
      # OpenRouter's rerank schema is Cohere-compatible. This pinned LiteLLM
      # version has no OpenRouter rerank adapter; its Cohere adapter accepts a
      # complete /v1/rerank URL and preserves the provider model identifier.
      model: cohere/voyageai/rerank-3-lite
      api_base: https://openrouter.ai/api/v1/rerank
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: rerank

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
  allow_client_side_credentials: false

litellm_settings:
  callbacks: [reference_gateway.policy]
  drop_params: true
  request_timeout: 45
  num_retries: 0
  set_verbose: false
